:root{
  --t:#2bf2f1;--t-d:#0f8c8b;--t-50:#e8fefe;--t-100:#d4fffe;--s:#082422;--s-2:#234343;--linen:#fefcf9;--stone:#efebe7;--conc:#cfcabf;
  --mut:#5d716f;--err:#f26629;--err-bg:#fde9e0;--ok:#1b7a29;--ok-bg:#e7f8e9;
  --font:"Saans","Inter",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:var(--font);color:var(--s);background:var(--linen);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
*::-webkit-scrollbar{display:none}
svg.i{display:block;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.device{position:relative;width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--stone)}
@media (min-width:600px){
  html,body{background:#e4dfd6}
  .device{width:390px;height:844px;max-height:calc(100vh - 32px);border-radius:48px;box-shadow:0 0 0 10px #0b1f1d,0 30px 80px rgba(8,36,34,.35)}
}

/* ── Header ── */
.top{flex:none;display:flex;align-items:center;gap:6px;padding:max(env(safe-area-inset-top),14px) 10px 10px;background:var(--s);color:#fff;z-index:5}
@media (min-width:600px){.top{padding-top:22px}}
.ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff}
.ic:active{background:rgba(255,255,255,.12)}
.who{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.av{width:40px;height:40px;border-radius:50%;background:var(--t);display:grid;place-items:center;flex:none;overflow:hidden}
.av img{width:22px;height:22px}
.who b{display:block;font-weight:600;font-size:18px;line-height:1.15}
.who small{display:block;font-size:13px;color:#9fd3d1;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small:empty{display:none}
.help{display:flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 12px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;font-weight:600;font-size:15px}
.help:active{background:rgba(255,255,255,.22)}

/* ── Chat ── */
.chat{flex:1;overflow-y:auto;padding:12px 12px 16px;display:flex;flex-direction:column;gap:2px;scroll-behavior:smooth;
  background-color:#ece6dc;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180' viewBox='0 0 180 180' fill='none' stroke='%23082422' stroke-opacity='.07' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><path d='m30 30 14-5-5 14-2-6z'/><circle cx='120' cy='28' r='9'/><path d='M120 24v8M117 26h5M117 30h5'/><rect x='24' y='108' width='13' height='22' rx='3'/><path d='M30 125h1'/><path d='M120 100l-8 12h6l-2 10 9-13h-6z'/><path d='M80 70c4-6 10-6 14 0'/><circle cx='152' cy='150' r='5'/><path d='M70 150l6 6 10-12'/></svg>");
  background-size:180px}
.dchip{align-self:center;margin:4px 0 10px;background:#fff9;backdrop-filter:blur(4px);color:#4a5d5b;font-size:12.5px;font-weight:500;padding:5px 12px;border-radius:8px;box-shadow:0 1px 1px rgba(8,36,34,.08)}
.row{display:flex;max-width:100%;animation:pop .22s ease-out both}
.row.f{justify-content:flex-start}
.row.u{justify-content:flex-end}
.row.first{margin-top:8px}
.col{display:flex;flex-direction:column;gap:3px;max-width:82%;min-width:0}
.row.wide .col{max-width:88%;width:88%}
.b{position:relative;padding:7px 10px 6px;border-radius:12px;font-size:16.5px;line-height:1.35;box-shadow:0 1px 1px rgba(8,36,34,.12);word-wrap:break-word;overflow-wrap:anywhere}
.f .b{background:#fff}
.u .b{background:var(--t-100)}
.f.first .b{border-top-left-radius:0}
.u.first .b{border-top-right-radius:0}
.f.first .b::before{content:"";position:absolute;left:-7px;top:0;border:8px solid transparent;border-top-color:#fff;border-right-color:#fff;border-left:0;border-bottom:0;width:0;height:0}
.u.first .b::before{content:"";position:absolute;right:-7px;top:0;border:8px solid transparent;border-top-color:var(--t-100);border-left-color:var(--t-100);border-right:0;border-bottom:0;width:0;height:0}
.sender{font-size:13.5px;font-weight:600;color:var(--t-d);margin-bottom:1px}
.ts{float:right;margin:7px 0 -2px 12px;font-size:11px;color:#6d807e;display:inline-flex;align-items:center;gap:3px;line-height:1}
.ts svg{width:15px;height:15px;stroke:var(--t-d);stroke-width:2.2}
.b strong{font-weight:600}

.typing .b{padding:12px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:#8a9b99;animation:bl 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}

/* botones de respuesta */
.btns{display:flex;flex-direction:column;gap:3px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 14px;border-radius:12px;background:#fff;box-shadow:0 1px 1px rgba(8,36,34,.12);font-weight:600;font-size:16.5px;color:var(--t-d);transition:transform .08s,opacity .2s}
.btn:active{transform:scale(.98);background:#f4f9f9}
.btns.used .btn{pointer-events:none;opacity:.5}
.btns.used .btn.sel{opacity:1;background:var(--t-50)}

/* nota de voz */
.vn{display:flex;align-items:center;gap:10px;min-width:210px;padding:2px 0}
.vn .pl{width:38px;height:38px;border-radius:50%;background:var(--t-d);color:#fff;display:grid;place-items:center;flex:none}
.vn .wv{flex:1;display:flex;align-items:center;gap:2px;height:30px}
.vn .wv i{flex:1;min-width:2px;border-radius:2px;background:#9db3b1;transition:background .1s}
.vn .wv i.on{background:var(--t-d)}
.vn .du{font-size:12.5px;color:var(--mut);min-width:30px;text-align:right}

/* comprobante */
.rc{min-width:230px}
.rc .rh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.rc .rh b{font-weight:600;font-size:15px;color:var(--mut);letter-spacing:.02em}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--ok-bg);color:var(--ok);font-weight:600;font-size:13px;padding:3px 10px;border-radius:999px}
.rc .big{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.rc .sub{font-size:14.5px;color:var(--mut);margin-bottom:8px}
.rc dl{margin:0;border-top:1px dashed var(--conc);padding-top:6px}
.rc dl div{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:14.5px}
.rc dt{color:var(--mut)}.rc dd{margin:0;font-weight:500;text-align:right}

/* composer: siempre visible */
.comp{flex:none;padding:8px 10px max(env(safe-area-inset-bottom),10px);background:var(--stone);border-top:1px solid #0001}
@media (min-width:600px){.comp{padding-bottom:14px}}
.comp .line{display:flex;align-items:center;gap:8px}
.comp [hidden]{display:none!important}
.pill-in{flex:1;display:flex;align-items:center;background:#fff;border-radius:999px;padding:0 18px;height:48px;box-shadow:0 1px 1px rgba(8,36,34,.1)}
.pill-in input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:17px;height:100%}
.pill-in input::placeholder{color:#8f9f9d}
.snd{width:48px;height:48px;border-radius:50%;background:var(--t);color:var(--s);display:grid;place-items:center;flex:none}
.snd:active{background:var(--t-d);color:#fff}
.snd.gh{background:none;color:var(--mut)}
.snd.gh:active{background:#0001;color:var(--s)}
.recpill{flex:1;display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:0 18px;height:48px;box-shadow:0 1px 1px rgba(8,36,34,.1);min-width:0}
.recpill .dot{width:11px;height:11px;border-radius:50%;background:#e5392b;animation:bl 1s infinite;flex:none}
.recpill b{font-weight:500;font-size:17px;font-variant-numeric:tabular-nums}
.recpill span{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── Widget / pop-up ── */
.ov{position:absolute;inset:0;background:rgba(8,36,34,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30;display:flex;align-items:flex-end}
.ov.on{opacity:1;pointer-events:auto}
.sheet{width:100%;max-height:94%;background:var(--linen);border-radius:28px 28px 0 0;transform:translateY(100%);transition:transform .34s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;padding-bottom:max(env(safe-area-inset-bottom),0px)}
.ov.on .sheet{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--conc);margin:8px auto 0}
.sh{display:flex;align-items:center;gap:4px;padding:6px 10px 0}
.sh .ic{color:var(--s);width:42px;height:42px}
.sh .ic:active{background:var(--stone)}
.sh .ic[hidden]{visibility:hidden;display:grid}
.sh .tt{flex:1;text-align:center}
.sh .tt b{display:block;font-weight:600;font-size:17px}
.sh .tt small{display:block;font-size:12.5px;color:var(--mut)}
.sb{overflow-y:auto;padding:8px 20px 8px;flex:1}
.q{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin:6px 0 14px}
.cta{padding:8px 20px 18px;display:flex;flex-direction:column;gap:6px}
.pri{height:54px;border-radius:999px;background:var(--s);color:var(--t);font-weight:600;font-size:17px;transition:opacity .2s}
.pri:disabled{background:var(--stone);color:#9aa8a6;cursor:not-allowed}
.pri:active:not(:disabled){background:var(--s-2)}
.sec{height:44px;color:var(--mut);font-weight:600;font-size:16px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border-radius:18px;padding:12px 14px;margin-bottom:8px;box-shadow:0 0 0 1px rgba(8,36,34,.07);transition:transform .08s}
.opt:active{transform:scale(.99);background:var(--t-50)}
.opt .ph{width:44px;height:44px;border-radius:50%;background:var(--stone);display:grid;place-items:center;flex:none;overflow:hidden}
.opt .ph img{width:30px;height:33px;object-fit:contain}
.opt .tx{flex:1;min-width:0}
.opt .tx b{display:block;font-weight:600;font-size:17px}
.opt .tx small{display:block;font-size:14px;color:var(--mut)}
.opt .am{font-weight:600;font-size:17px}
.opt.off{opacity:.5;pointer-events:none}
.opt .paid{font-size:13px;font-weight:600;color:var(--ok);background:var(--ok-bg);padding:3px 10px;border-radius:999px}

.amt{text-align:center;margin:4px 0 2px}
.amt .v{font-size:58px;font-weight:500;letter-spacing:-.03em;line-height:1.05}
.amt .v .u2{font-size:22px;color:var(--mut);margin-left:6px;letter-spacing:0}
.recv{text-align:center;font-size:16px;color:var(--s-2);min-height:22px}
.recv b{font-weight:600}
.note{text-align:center;font-size:13.5px;color:var(--mut);margin:4px 0 8px;min-height:19px}
.note.err{color:#b8420f}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:4px -6px 0}
.kp button{height:54px;border-radius:14px;font-size:26px;font-weight:500;display:grid;place-items:center}
.kp button:active{background:var(--stone)}
.rv{background:#fff;border-radius:20px;padding:6px 16px;box-shadow:0 0 0 1px rgba(8,36,34,.06);margin:0}
.rv div{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px solid var(--stone);font-size:16px}
.rv div:first-child{border-top:0}
.rv dt{color:var(--mut)}.rv dd{margin:0;font-weight:500;text-align:right}
.rv .tot{font-weight:600}.rv .tot dd{font-weight:600;font-size:18px}
.warn{font-size:14px;color:var(--mut);margin:12px 4px 0;line-height:1.4}
.helpbody{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:10px 6px 4px}
.helpbody .big{width:64px;height:64px;border-radius:50%;background:var(--t);display:grid;place-items:center}
.helpbody p{margin:0;font-size:16.5px;line-height:1.4;color:var(--s-2)}

@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes bl{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── v3: botones de respuesta más cuidados ── */
.btns{gap:6px;margin-top:2px;min-width:250px}
.btns:empty{display:none}
.btn{justify-content:flex-start;text-align:left;gap:12px;min-height:58px;padding:9px 14px 9px 10px;border-radius:18px;background:#fff;color:var(--s);font-weight:600;font-size:16.5px;box-shadow:0 1px 2px rgba(8,36,34,.14),0 0 0 1px rgba(8,36,34,.04)}
.btn .bi{width:40px;height:40px;border-radius:13px;background:var(--s);color:var(--t);display:grid;place-items:center;flex:none;transition:background .2s,color .2s}
.btn .bl{flex:1;line-height:1.2}
.btn .ch{color:#9aa8a6;flex:none}
.btn:active{background:var(--t-50);transform:scale(.985)}
.btns.used .btn{opacity:.45}
.btns.used .btn.sel{opacity:1;background:var(--s);color:#fff}
.btns.used .btn.sel .bi{background:var(--t);color:var(--s)}
.btns.used .btn.sel .ch{color:var(--t)}

/* ── checkout ── */
.co-h{background:var(--s);color:#fff;border-radius:22px;padding:18px 20px;margin-bottom:12px;display:flex;flex-direction:column;gap:2px}
.co-h small{font-size:14px;color:#9fd3d1}
.co-h b{font-size:42px;font-weight:500;letter-spacing:-.03em;color:var(--t);line-height:1.1}
.co-h span{font-size:13px;color:#9fd3d1}
.co-pay{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border-radius:18px;padding:12px 14px;margin-top:12px;box-shadow:0 0 0 1px rgba(8,36,34,.1)}
.co-pay .tx{flex:1;min-width:0}
.co-pay small{display:block;font-size:13px;color:var(--mut)}
.co-pay b{display:block;font-weight:600;font-size:16.5px}
.co-pay .chg{font-size:14px;font-weight:600;color:var(--t-d)}
.secure{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--mut);margin:12px 0 0}
.lg{width:44px;height:30px;border-radius:7px;background:#fff;box-shadow:0 0 0 1px rgba(8,36,34,.12);display:grid;place-items:center;flex:none;overflow:hidden}
.lg img{width:34px;height:auto;max-height:22px;object-fit:contain}
.lg.gen{background:var(--stone);color:var(--s-2)}
.rad{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--conc);flex:none;display:grid;place-items:center}
.opt.on .rad{background:var(--s);box-shadow:none;color:var(--t)}
.opt.on{box-shadow:0 0 0 2px var(--s)}
.opt.add{background:none;box-shadow:inset 0 0 0 1.5px var(--conc);color:var(--s);border-radius:18px}
.opt.add .ph{background:var(--t);color:var(--s)}
.opt.add:active{background:var(--t-50)}
.opt.st{cursor:default}
.opt.st:active{transform:none;background:#fff}

/* formularios y selectores */
.lbl{font-size:14px;font-weight:600;color:var(--mut);margin:14px 2px 8px}
.lbl:first-of-type{margin-top:0}
.field{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:0 16px;height:56px;box-shadow:0 0 0 1px rgba(8,36,34,.12);margin-bottom:4px}
.field:focus-within{box-shadow:0 0 0 2px var(--s)}
.field input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:18px;font-weight:500;height:100%}
.field input::placeholder{color:#a0aead;font-weight:400}
.hintx{font-size:13.5px;color:var(--mut);margin:4px 4px 0;line-height:1.35}
.row2{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.ctiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ctile{display:flex;align-items:center;gap:10px;height:54px;padding:0 12px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px rgba(8,36,34,.1);font-weight:600;font-size:16px;text-align:left}
.ctile img{width:24px;height:26px;object-fit:contain;flex:none}
.ctile.on{background:var(--s);color:#fff;box-shadow:none}
.stepper{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:20px;padding:10px;box-shadow:0 0 0 1px rgba(8,36,34,.08)}
.stepper button{width:52px;height:52px;border-radius:50%;background:var(--stone);font-size:28px;font-weight:500;display:grid;place-items:center}
.stepper button:active{background:var(--t)}
.stepper .sv{text-align:center}
.stepper .sv b{display:block;font-size:34px;font-weight:500;letter-spacing:-.02em;line-height:1.1}
.stepper .sv small{font-size:13px;color:var(--mut)}
.codebox{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:inset 0 0 0 1.5px var(--conc);width:100%;margin-top:6px}
.codebox b{font-size:20px;font-weight:600;letter-spacing:.06em}
.codebox span{font-size:14px;font-weight:600;color:var(--t-d)}
.mini{font-size:12.5px;color:var(--mut)}

/* movimientos en el chat */
.hs .hh{font-weight:600;font-size:15px;color:var(--mut);letter-spacing:.02em;margin-bottom:4px}
.hs div.r{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-top:1px solid var(--stone);font-size:15px}
.hs div.r:first-of-type{border-top:0}
.hs .r small{display:block;color:var(--mut);font-size:13px}
.hs .r b{font-weight:600;white-space:nowrap}

/* ── menú hamburguesa ── */
.dov{position:absolute;inset:0;background:rgba(8,36,34,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.dov.on{opacity:1;pointer-events:auto}
.drawer{position:absolute;top:0;bottom:0;left:0;width:86%;max-width:340px;background:var(--linen);transform:translateX(-102%);transition:transform .32s cubic-bezier(.16,1,.3,1);z-index:41;display:flex;flex-direction:column;visibility:hidden;transition:transform .32s cubic-bezier(.16,1,.3,1),visibility 0s .32s}
.drawer.on{transform:none;visibility:visible;box-shadow:8px 0 30px rgba(8,36,34,.25);transition:transform .32s cubic-bezier(.16,1,.3,1),visibility 0s}
.dh{background:var(--s);color:#fff;padding:max(env(safe-area-inset-top),16px) 16px 16px;display:flex;align-items:center;gap:12px}
@media (min-width:600px){.dh{padding-top:24px}}
.dh .av{width:46px;height:46px;font-weight:600;font-size:19px;color:var(--s)}
.dh .nm{flex:1;min-width:0}
.dh .nm b{display:block;font-size:18px;font-weight:600}
.dh .nm small{display:block;font-size:13.5px;color:#9fd3d1}
.dx{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff}
.dx:active{background:rgba(255,255,255,.14)}
.dbody{flex:1;overflow-y:auto;padding:14px 12px 20px}
.promo{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border-radius:20px;padding:14px;background:var(--s);color:#fff;position:relative;overflow:hidden;margin-bottom:6px}
.promo::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--t);opacity:.16}
.promo .gi{width:46px;height:46px;border-radius:15px;background:var(--lime,#dcff00);color:var(--s);display:grid;place-items:center;flex:none}
.promo b{display:block;font-size:18px;font-weight:600}
.promo small{display:block;font-size:13.5px;color:#b9dfdd;line-height:1.3;margin-top:1px}
.promo:active{opacity:.92}
.grp{font-size:12.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:18px 8px 6px}
.it{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:11px 10px;border-radius:14px;font-size:16.5px;font-weight:500}
.it:active{background:var(--stone)}
.it .ii{width:38px;height:38px;border-radius:12px;background:var(--stone);display:grid;place-items:center;flex:none;color:var(--s)}
.it span.t{flex:1}
.it .soon{font-size:12px;font-weight:600;color:var(--mut);background:var(--stone);border-radius:999px;padding:3px 9px}
.drawer.locked .it:not(.free),.drawer.locked .promo{opacity:.4;pointer-events:none}
.lockn{display:none;font-size:13.5px;color:var(--mut);background:var(--stone);border-radius:12px;padding:10px 12px;margin-bottom:10px;line-height:1.35}
.drawer.locked .lockn{display:block}

/* ── v4: menú del header y llamada ── */
.chev{width:36px;height:40px;margin-right:-2px;border-radius:50%}
.pop{position:absolute;top:66px;right:10px;z-index:35;min-width:210px;background:#fff;border-radius:16px;padding:6px;box-shadow:0 10px 30px rgba(8,36,34,.28),0 0 0 1px rgba(8,36,34,.06);opacity:0;transform:translateY(-6px) scale(.97);transform-origin:top right;pointer-events:none;transition:opacity .16s,transform .16s}
@media (min-width:600px){.pop{top:74px}}
.pop.on{opacity:1;transform:none;pointer-events:auto}
.pi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;font-size:16.5px;font-weight:500;color:var(--s)}
.pi:active{background:var(--stone)}
.pic{width:36px;height:36px;border-radius:12px;background:var(--s);color:var(--t);display:grid;place-items:center;flex:none}
.pic svg{width:20px;height:20px}
.call{position:absolute;inset:0;z-index:60;background:linear-gradient(180deg,#082422 0%,#0d3a37 100%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(env(safe-area-inset-top),64px) 24px max(env(safe-area-inset-bottom),44px);opacity:0;pointer-events:none;transition:opacity .25s}
.call.on{opacity:1;pointer-events:auto}
.cmid{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:40px}
.cmid b{font-size:30px;font-weight:600;letter-spacing:-.02em}
.cmid span{font-size:17px;color:#9fd3d1}
.rings{position:relative;width:150px;height:150px;display:grid;place-items:center;margin-bottom:18px}
.rings i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--t);opacity:0;animation:ring 2.4s infinite}
.rings i:nth-child(2){animation-delay:.8s}.rings i:nth-child(3){animation-delay:1.6s}
.cav{width:112px;height:112px;border-radius:50%;background:var(--t);display:grid;place-items:center;position:relative}
.cav img{width:60px;height:60px}
@keyframes ring{0%{transform:scale(.75);opacity:.7}100%{transform:scale(1.35);opacity:0}}
.cnote{font-size:13.5px;color:#7fb3b0;text-align:center;max-width:260px;line-height:1.4}
.cbtns{display:flex;align-items:center;justify-content:center;gap:28px}
.cb2{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;transition:background .15s}
.cb2:active{background:rgba(255,255,255,.28)}
.cb2.on{background:#fff;color:var(--s)}
.cb2.end{width:72px;height:72px;background:#e5392b}
.cb2.end:active{background:#c42d20}

/* ── v5: proporciones de iPhone 16 (393 × 852, marco 12, esquinas 55, isla dinámica) ── */
.sbar,.hind{display:none}
@media (min-width:500px){
  html,body{background:#e4dfd6}
  .stage{overflow:hidden}
  .device{flex:none;width:393px;height:852px;max-height:none;border-radius:55px;transform:scale(var(--k,1));transform-origin:center;box-shadow:0 0 0 12px #0a0a0a,0 0 0 13px #2a2a2a,0 30px 80px rgba(8,36,34,.35);isolation:isolate}
  .device::after{content:"";position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000;z-index:100;pointer-events:none}
  .sbar{display:flex;align-items:center;justify-content:space-between;position:absolute;top:0;left:0;right:0;height:54px;padding:6px 34px 0 46px;color:#fff;z-index:99;pointer-events:none}
  .sbar b{font-size:17px;font-weight:600;letter-spacing:-.01em}
  .sbar span{display:flex;align-items:center;gap:6px}
  .hind{display:block;position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#0a0a0a;opacity:.85;z-index:99;pointer-events:none}
  .top{padding-top:56px}
  .comp{padding-bottom:26px}
  .dh{padding-top:62px}
  .pop{top:106px}
  .sheet{max-height:calc(100% - 56px);padding-bottom:14px}
  .call{padding-top:96px;padding-bottom:50px}
}

/* número de teléfono */
.ccsel{display:flex;align-items:center;gap:10px;width:100%;height:56px;padding:0 14px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px rgba(8,36,34,.12);text-align:left}
.ccsel img{width:24px;height:26px;object-fit:contain;flex:none}
.ccsel b{font-size:18px;font-weight:600}
.ccsel span{flex:1;font-size:15px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccsel svg{color:var(--mut)}
.pnum{text-align:center;font-size:38px;font-weight:500;letter-spacing:-.01em;line-height:60px;min-height:60px;margin-top:6px;font-variant-numeric:tabular-nums}
.pnum .pl{color:#c3cccb}

/* ── v6: jerarquía de botones y sin decoración inventada ── */
.promo::after{display:none}
.promo{justify-content:space-between}
.promo svg{color:var(--t);flex:none}
.btns{gap:8px;margin-top:4px}
.btn{justify-content:center;text-align:center;min-height:50px;padding:0 20px;border-radius:14px;font-weight:600;font-size:16.5px;box-shadow:none;gap:0}
.btn.pri1{background:var(--s);color:var(--t)}
.btn.pri1:active{background:var(--s-2)}
.btn.sec1{background:#fff;color:var(--s);box-shadow:inset 0 0 0 1.5px var(--s)}
.btn.sec1:active{background:var(--t-50)}
.btns.used .btn{opacity:.35}
.btns.used .btn.sel{opacity:1}
.btns.used .btn.sel.pri1{background:var(--s);color:var(--t)}
.btns.used .btn.sel.sec1{background:#fff;color:var(--s)}

/* ── v7: botones del chat: pastilla blanca, ícono slate sobre círculo gris ── */
.btns{gap:8px;margin-top:4px}
.btn{display:flex;align-items:center;justify-content:flex-start;text-align:left;gap:12px;min-height:56px;padding:8px 16px 8px 8px;border-radius:999px;background:#fff;color:var(--s);font-weight:600;font-size:16.5px;box-shadow:0 1px 2px rgba(8,36,34,.14),0 0 0 1px rgba(8,36,34,.04)}
.btn .bi{width:40px;height:40px;border-radius:50%;background:var(--stone);color:var(--s);display:grid;place-items:center;flex:none}
.btn .bl{flex:1;line-height:1.2}
.btn .ch{color:var(--s);opacity:.45;flex:none;display:flex}
.btn:active{background:var(--stone);transform:scale(.985)}
.btns.used .btn{opacity:.4}
.btns.used .btn.sel{opacity:1;background:#fff;color:var(--s);box-shadow:inset 0 0 0 2px var(--s)}
.btns.used .btn.sel .bi{background:var(--stone);color:var(--s)}
.btns.used .btn.sel .ch{color:var(--s);opacity:.45}

/* ── v8: acciones sugeridas como pills (formato híbrido) + herramientas en tarjetas ── */
.btns{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;min-width:0;margin:8px 2px 4px;animation:pop .22s ease-out both}
.btns.used{display:none}

.tksep{position:relative;border-top:1.5px dashed var(--conc);margin:18px -20px 12px}
.tksep i{position:absolute;top:-10px;width:20px;height:20px;border-radius:50%;background:var(--linen)}
.tksep i:first-child{left:-10px}.tksep i:last-child{right:-10px}
.tkd{margin:0}.tkd div{display:flex;justify-content:space-between;gap:14px;padding:6px 0;font-size:15.5px}

.tkm{display:flex;align-items:center;gap:12px;width:100%;min-width:240px;text-align:left;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 0 0 1px rgba(8,36,34,.08);margin:2px 0}
.tkm:active{transform:scale(.99)}
.tkm .ph{width:38px;height:38px;border-radius:50%;background:var(--stone);display:grid;place-items:center;overflow:hidden;flex:none}
.tkm .ph img{width:100%;height:100%;object-fit:cover}
.tkm .tx{flex:1;min-width:0}.tkm .tx b{display:block;font-size:15px}.tkm .tx small{font-size:14px;color:var(--mut,#5b6b69);white-space:nowrap}.tkm .st .pill{font-size:12.5px;padding:3px 8px;white-space:nowrap}

  transition:transform .15s ease}
.top .ic:active,.help:active,.bolt:active{background:linear-gradient(145deg,rgba(255,255,255,.8),rgba(255,255,255,.35));transform:scale(.94)}
.pill-in{position:relative}
.pill-in input{padding-left:6px}
.pill-in.hint:not(:focus-within)::before{content:"";position:absolute;left:18px;top:50%;width:2px;height:22px;margin-top:-11px;background:var(--s);animation:caretBlink2 1s steps(1) infinite;pointer-events:none}

const chat=$("#chat");let lastFrom=null;

function bubble(from,html,o={}){
  if(!o.still)expandSheet();
  const r=document.createElement("div");
  r.className="row "+from+(lastFrom===from?"":" first")+(o.wide?" wide":"")+(o.still?" still":"");
  lastFrom=from;
  r.innerHTML=`<div class="col"><div class="b">${o.who?`<div class="sender">${o.who}</div>`:""}${html}<span class="ts">${o.ts||clock()}${from==="u"?svg(P.ticks,15):""}</span></div><div class="btns"></div></div>`;
  chat.appendChild(r);toEnd();return r;
}
const user=t=>bubble("u",t);
const pillIn=()=>document.querySelector(".pill-in");
async function bot(html,o={}){
  pillIn().classList.remove("hint");
  const ty=document.createElement("div");
  ty.className="row f typing"+(lastFrom==="f"?"":" first");
  ty.innerHTML='<div class="col"><div class="b"><i></i><i></i><i></i></div></div>';
  chat.appendChild(ty);toEnd();
  const pl=html.replace(/<[^>]*>/g,"").length;
  await sleep((o.wait??Math.min(1900,900+pl*16)));
  ty.remove();
  const r=bubble("f",html,o);
  if(o.buttons)addButtons(r,o.buttons);
  await sleep(o.after??Math.min(1600,450+pl*14));
  if(!ci.value)pillIn().classList.add("hint");
  return r;
}
const closeBtns=()=>document.querySelectorAll(".btns:not(.used)").forEach(w=>w.classList.add("used"));
function addButtons(row,list){
  const wrap=document.createElement("div");wrap.className="btns";chat.appendChild(wrap);
  list.forEach((bt,i)=>{
    const b=document.createElement("button");b.className="btn";
    b.innerHTML=(bt.icon?`<i>${bt.icon}</i>`:"")+bt.label;
    b.onclick=async()=>{
      if(bt.keep){if(st.mode==="busy"||S.res)return;st.mode="busy";await bt.run();if(st.mode==="busy")setMode("menu");return}
      if(wrap.classList.contains("used")||st.mode==="busy")return;
      st.mode="busy";wrap.classList.add("used");b.classList.add("sel");
      await sleep(180);user(bt.label);await sleep(250);await bt.run();
    };
    wrap.appendChild(b);
  });
  toEnd();
}

function kpBind(r,get,set,upd){

const BAL={brand:"Saldo Félix",last:"",bal:true};
const CRED={brand:"Envía ahora, paga después",last:"",credit:true};
function payFlow(o){
  let card=null;
  const list=()=>[...(st.acct.bal>0&&!o.noBal?[BAL]:[]),...CARDS];
  const okC=()=>o.credit&&o.credit.amt>=50&&o.credit.amt<=250;
  const method=()=>S.set({title:o.mT||"Medio de pago",step:o.stepM,back:o.back,
    html:`<div class="q">${o.q||"¿Con qué pagas?"}</div>`+list().map((c,i)=>{
      const off=c.bal&&st.acct.bal<o.total;
      return `<button class="opt${c===card?" on":""}${off?" off":""}" data-i="${i}">${cardLogo(c)}<span class="tx"><b>${c.brand}</b><small>${c.bal?(off?"Saldo insuficiente · "+usd(st.acct.bal):"Disponible "+usd(st.acct.bal)):(c.last?(c.debit?"Débito · ":"")+"Termina en "+c.last:"Conectado")}</small></span><span class="rad">${c===card?svg(P.check,13):""}</span></button>`}).join("")+
            (o.credit?`<button class="opt${okC()?"":" off"}" id="crd"><span class="lg gen">${svg(P.cal,18)}</span><span class="tx"><b>Envía ahora, paga después</b><small>${okC()?"4 cuotas cada 15 días · 10%":"Disponible de $50 a $250"}</small></span><span class="rad"></span></button>`:"")+
      `<button class="opt add" id="addp"><span class="ph">${svg(P.plus,22)}</span><span class="tx"><b>Agrega método de pago</b></span></button>`,
    bind:r=>{
      r.querySelectorAll(".opt[data-i]").forEach(b=>b.onclick=()=>{card=list()[+b.dataset.i];checkout()});
      const k=$("#crd");if(k)k.onclick=()=>{card=CRED;checkout()};
      $("#addp").onclick=()=>cardForm(method,c=>{card=c;checkout()});
    }});
  const checkout=()=>{
    let rows=o.rows,total=o.total,ex=null;
    if(card.credit){
      const a=o.credit.amt,cost=+(a*0.10).toFixed(2),inst=+(a/4).toFixed(2),ds=satDates().map(fmtD);
      rows=[...o.rows,["Comisión de Envía ahora, paga después (10%)",usd(cost)],["Cuotas","4 de "+usd(inst)],["Fechas",ds.join(", ")],["Cuotas se cobran a",cLabel(CARDS.find(c=>c.debit))],["Aviso","Un día antes de cada cobro"]];
      total=o.credit.fee+cost;ex={cost};
    }
    S.set({title:o.cT||"Pagar",step:o.stepC,back:method,
      html:`<div class="co-h"><small>${card.credit?"Hoy pagas":(o.totalLabel||"Total a pagar")}</small><b>${usd(total)}</b><span>USD</span></div>
        <dl class="rv">${rows.map(r=>`<div><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`).join("")}</dl>
        <button class="co-pay" id="chg">${cardLogo(card)}<span class="tx"><small>${o.withL||"Pagas con"}</small><b>${cLabel(card)}</b></span><span class="chg">Cambiar</span></button>
        <div class="secure">${svg(P.lock,15)}Pago seguro. Revisa los datos antes de continuar.</div>`,
      cta:{label:total>0?(o.cta||"Pagar")+" "+usd(total):"Confirmar",fn:async()=>{
        setCta("Procesando…",true);await sleep(1400);
        S.close(o.done(card,ex,total));
      }},
      bind:()=>{$("#chg").onclick=method}});
  };
  method();
}

    sub:n=>n>0?(rOK()?`${p.first} recibe <b>$${num(n*p.rate)} ${p.cur}</b>`:"Monto a recibir por definir"):"",
    next:n=>{amt=n;s3()}});

      done:(card,ex,total)=>{
        if(p.isNew){p.isNew=false;PEOPLE.push(p)}
        return{p,usd:n,fee,tot:total,got,card,cost:ex?ex.cost:0,folio:"FX-"+(48000000+Math.floor(Math.random()*999999))};

/* ───────── flujo ───────── */
async function menu(text,ice,keepQ){
  st.resume=()=>menu("¿Qué quieres hacer?");
  if(!ice&&keepQ){await bot(text);setMode("menu");return}
  if(!ice){
    text=(text||"").replace(/\s*¿Qué (más )?quieres hacer\?/g,"").trim();
    if(!text){setMode("menu");return}
    await bot(text);setMode("menu");return;
  }
  await bot(text,{buttons:ice?[
    {label:"Enviar dinero",icon:IC("send"),run:doSend},
    {label:"Pedir un préstamo",icon:IC("trend"),run:doLoan},
    st.hasAcct?{label:"Pagar servicios",icon:IC("bolt"),run:doPay}:{label:"Abrir billetera",icon:IC("card"),run:doCuenta},
    {label:"Calcular un envío",icon:IC("calc"),run:doCalc}]:[
    {label:"Enviar dinero",icon:IC("send"),run:doSend},
    {label:"Pagar servicios",icon:IC("bolt"),run:doPay}]});
  setMode("menu");
}
const more=()=>menu("¿Qué más quieres hacer?");
async function cancelled(){await menu("No hay problema, no hicimos ningún cobro. ¿Qué quieres hacer?",false,true)}

async function doDeposit(){
  if(!st.hasAcct)return offerCuenta();
  const r=await depositWidget();
  if(!r)return cancelled();
  st.acct.bal+=r.n;st.hist.unshift({t:"Depósito",d:dShort(),a:r.n});
  return menu(`Listo, depositaste ${usd(r.n)}. Tu saldo es ${usd(st.acct.bal)}. ¿Qué más quieres hacer?`);
}
async function doWithdraw(){
  if(!st.hasAcct)return offerCuenta();
  const r=await withdrawWidget();
  if(r&&r.go==="deposit")return doDeposit();
  if(!r)return more();
  st.acct.bal-=r.n;st.hist.unshift({t:"Retiro",d:dShort(),a:-r.n});
  return menu(`Listo, retiramos ${usd(r.n)} a tu banco. Llega en 1 día hábil. ¿Qué más quieres hacer?`);
}
async function doSummary(){
  if(!st.hasAcct)return offerCuenta();
  const r=await summaryWidget();
  if(r&&r.go==="deposit")return doDeposit();
  return more();
}
async function doCredit(){
  const r=await creditWidget();
  if(r&&r.go==="deposit")return doDeposit();
  if(!r)return more();
  if(r.kind==="use"){
    st.acct.bal+=r.n;st.acct.owed+=r.n;st.hist.unshift({t:"Línea de crédito",d:dShort(),a:r.n});
    return menu(`Listo, ya tienes ${usd(r.n)} en tu cuenta. ¿Qué más quieres hacer?`);
  }
  st.acct.bal-=r.n;st.acct.owed-=r.n;st.hist.unshift({t:"Pago a tu línea",d:dShort(),a:-r.n});
  return menu(st.acct.owed>0?`Listo, pagaste ${usd(r.n)}. Todavía debes ${usd(st.acct.owed)}. ¿Qué más quieres hacer?`:`Listo, pagaste ${usd(r.n)}. Ya no debes nada en tu línea. ¿Qué más quieres hacer?`);
}
async function doSnpl(){
  const r=await snplWidget();
  if(r&&r.go==="send")return doSend();
  return more();
}
async function doSched(){
  const r=await schedWidget();
  if(!r||!r.p)return more();
  if(r.card.bal)st.acct.bal-=r.tot;
  st.hist.unshift({t:"Envío a "+r.p.name,d:dShort(),a:-r.tot,n:r.n});
  return menu(`Listo, programamos ${usd(r.n)} para ${r.p.first}, ${r.f.toLowerCase()}. El primero ya salió. ¿Qué más quieres hacer?`);
}

async function doCancel(x){

/* widget: código de verificación */
function codeWidget(phone){
  const pr=S.open();let v="",tm=null,left=30,fin=false;
  const draw=()=>{
    $("#otp").innerHTML=[0,1,2,3,4,5].map(k=>`<span class="${k===v.length?"on":""}">${v[k]||""}</span>`).join("");
    $("#otp").setAttribute("aria-label",`Código de 6 dígitos. Llevas ${v.length}.`);
  };
  S.set({title:"Código de verificación",
    html:`<div class="q" style="text-align:center;margin-bottom:2px">Escribe el código que te enviamos</div>
      <div class="note" style="margin:0">Mandamos un SMS al ${phone}</div>
      <div class="otp" id="otp" role="group"></div>
      <div class="oerr" id="oerr" role="alert"></div>
      <button class="ofill" id="ofill" aria-label="Usar el código 123456 del mensaje"><small>Del mensaje</small><b>123456</b></button>
      ${KP.replace('data-k="."','data-k="" disabled aria-hidden="true" style="visibility:hidden"')}
      <div class="ores" id="ores"></div>`,
    sec:{label:"Cambiar número",fn:()=>{fin=true;clearInterval(tm);hideSms();S.resolve("change")}},
    bind:r=>{
      const send=()=>{
        if(fin||v.length<6)return;
        if(v==="123456"){fin=true;clearInterval(tm);hideSms();$("#sr").textContent="Código correcto.";setTimeout(()=>S.close(v),300)}
        else{
          const o=$("#otp");o.classList.add("bad");$("#oerr").textContent="Ese código no coincide. Revisa el SMS y vuelve a intentarlo.";
          setTimeout(()=>{v="";o.classList.remove("bad");draw()},700);
        }
      };
      const put=k=>{if(fin||v.length>=6)return;$("#oerr").textContent="";v+=k;draw();if(v.length===6)setTimeout(send,150)};
      const del=()=>{if(fin)return;v=v.slice(0,-1);$("#oerr").textContent="";draw()};
      r.querySelectorAll(".kp button[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==="x")del();else if(k)put(k)});
